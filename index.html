<footer>好奇1000 · 離線 PWA 版</footer></main><script>window.QUIZ_BANK = [{"id":"Q0001","category":"動物奇聞","question":"八爪魚有幾顆心臟？","options":["4顆","1顆","3顆","2顆"],"answer":2,"explanation":"兩顆把血送往鰓，一顆供應全身。","answer_letter":"C","source":{"title":"Natural History Museum｜Octopuses keep surprising us","url":"https://www.nhm.ac.uk/discover/octopuses-keep-surprising-us-here-are-eight-examples-how.html"}},{"id":"Q0002","category":"動物奇聞","question":"八爪魚含氧血液呈甚麼顏色？","options":["藍色","綠色","紅色","黃色"],"answer":0,"explanation":"運氧的血藍蛋白含銅，與人類含鐵的血紅蛋白不同。","answer_letter":"A","source":{"title":"Natural History Museum｜Octopuses keep surprising us","url":"https://www.nhm.ac.uk/discover/octopuses-keep-surprising-us-here-are-eight-examples-how.html"}},{"id":"Q0003","category":"動物奇聞","question":"袋熊便便最出名的形狀是？","options":["近似立方體","圓盤形","螺旋形","星形"],"answer":0,"explanation":"腸壁不同部位的彈性差異參與塑形，並非肛門是方形。","answer_letter":"A","source":null},{"id":"Q0004","category":"動物奇聞","question":"火烈鳥羽毛粉紅色主要來自？","options":["陽光漂白","皮膚血液","食物色素","海水鹽分"],"answer":2,"explanation":"食物中的類胡蘿蔔素累積於羽毛，幼鳥並非一出生就鮮粉紅。","answer_letter":"C","source":null},{"id":"Q0005","category":"動物奇聞","question":"唯一能持續拍翼飛行的哺乳類是？","options":["飛狐猴","蝙蝠","鼯鼠","蜜袋鼯"],"answer":1,"explanation":"其他選項靠高低落差滑翔，蝙蝠可以主動產生升力。","answer_letter":"B","source":null},{"id":"Q0006","category":"動物奇聞","question":"樹熊的哪項特徵與人類很相似？","options":["指紋紋路","腳掌大小","牙齒數量","瞳孔形狀"],"answer":0,"explanation":"指尖有複雜皮膚脊紋，這種相似並不代表牠是靈長類。","answer_letter":"A","source":null},{"id":"Q0007","category":"動物奇聞","question":"貓對哪種味道的感受能力特別弱？","options":["甜味","酸味","鹹味","苦味"],"answer":0,"explanation":"甜味受體相關基因失去功能，不等於其他味覺也消失。","answer_letter":"A","source":null},{"id":"Q0008","category":"動物奇聞","question":"長頸鹿通常有幾節頸椎？","options":["28節","21節","7節","14節"],"answer":2,"explanation":"與人類數目相同，主要是每節頸椎更長。","answer_letter":"C","source":null},{"id":"Q0009","category":"動物奇聞","question":"鴨嘴獸如何繁殖？","options":["胎盤內育幼","口中孵胎","出芽生殖","產卵"],"answer":3,"explanation":"牠屬單孔類，產卵後仍以乳汁哺育幼獸。","answer_letter":"D","source":null},{"id":"Q0010","category":"動物奇聞","question":"鴨嘴獸閉眼潛水時可用甚麼找獵物？","options":["紅外成像","電感受","磁吸作用","回聲定位"],"answer":1,"explanation":"吻部能偵測獵物肌肉活動產生的微弱電訊號。","answer_letter":"B","source":null},{"id":"Q0011","category":"動物奇聞","question":"雄海馬以哪個構造孕育胚胎？","options":["尾端卵袋","鰓腔","胃部","育兒囊"],"answer":3,"explanation":"雌魚把卵放入雄魚育兒囊，雄魚負責後續孵育。","answer_letter":"D","source":null},{"id":"Q0012","category":"動物奇聞","question":"海星沿海床緩慢爬行，主要靠哪個構造？","options":["腹部剛毛","關節長腿","管足","魚鰭"],"answer":2,"explanation":"水管系統協調大量管足附着和伸縮，像許多小腳一起工作。","answer_letter":"C","source":null},{"id":"Q0013","category":"動物奇聞","question":"海膽口部的咀嚼構造俗稱？","options":["亞里士多德提燈","牛頓齒輪","達爾文剪刀","伽利略漏斗"],"answer":0,"explanation":"這套複雜齒器通常有五顆牙，可刮食表面食物。","answer_letter":"A","source":null},{"id":"Q0014","category":"動物奇聞","question":"海參為甚麼有時會排出內臟？","options":["改變性別","吸引伴侶","幫助浮游","防禦捕食者"],"answer":3,"explanation":"部分種類有排臟防禦，失去的組織之後可再生。","answer_letter":"D","source":null},{"id":"Q0015","category":"動物奇聞","question":"燈塔水母的特殊本領是？","options":["不需任何能量","永久不被捕食","離水長期生存","退回較早生命階段"],"answer":3,"explanation":"牠能在特定條件下回到水螅體階段，但不是不會死亡。","answer_letter":"D","source":null},{"id":"Q0016","category":"動物奇聞","question":"水母主要靠哪種細胞捕獵？","options":["刺細胞","根毛細胞","骨細胞","紅血球"],"answer":0,"explanation":"刺細胞內的刺絲囊能迅速射出，協助捕食與防禦。","answer_letter":"A","source":null},{"id":"Q0017","category":"動物奇聞","question":"珊瑚在生物分類上屬於？","options":["真菌","細菌","動物","植物"],"answer":2,"explanation":"珊瑚蟲可用觸手捕食，很多種類也與藻類共生。","answer_letter":"C","source":null},{"id":"Q0018","category":"動物奇聞","question":"珊瑚白化通常涉及失去甚麼？","options":["共生藻類","所有骨骼","海水鹽分","全部觸手"],"answer":0,"explanation":"共生藻減少後露出白色骨骼；白化不一定代表已死亡。","answer_letter":"A","source":null},{"id":"Q0019","category":"動物奇聞","question":"海綿主要怎樣進食？","options":["吸食魚血","挖掘貝殼","咬碎海草","過濾水中微粒"],"answer":3,"explanation":"水流經體內孔道，細胞攔截細菌及其他細小食物。","answer_letter":"D","source":null},{"id":"Q0020","category":"動物奇聞","question":"海豚呼吸主要用甚麼？","options":["管足","皮膚","肺","鰓"],"answer":2,"explanation":"牠是哺乳類，要到水面以頭頂呼吸孔換氣。","answer_letter":"C","source":null},{"id":"Q0021","category":"動物奇聞","question":"海豚可以怎樣一邊休息一邊保持警覺？","options":["完全停止呼吸","把頭埋入泥沙","一側大腦較深睡眠","兩肺輪流睡眠"],"answer":2,"explanation":"單半球慢波睡眠讓部分腦維持較高警覺。","answer_letter":"C","source":null},{"id":"Q0022","category":"動物奇聞","question":"抹香鯨深潛主要追捕哪類動物？","options":["磷蝦","海草","水母","魷魚"],"answer":3,"explanation":"大型頭足類是重要食物，並非靠濾水吞食浮游生物。","answer_letter":"D","source":null},{"id":"Q0023","category":"動物奇聞","question":"獨角鯨的長角其實是？","options":["頭髮","延長的牙齒","脊椎","鼻骨"],"answer":1,"explanation":"通常由雄鯨的左上犬齒伸長形成，表面呈螺旋紋。","answer_letter":"B","source":null},{"id":"Q0024","category":"動物奇聞","question":"鬚鯨口中的鯨鬚主要由甚麼構成？","options":["角蛋白","石灰岩","牙釉質","軟骨"],"answer":0,"explanation":"材料與毛髮、指甲相關，用來濾出食物。","answer_letter":"A","source":null},{"id":"Q0025","category":"動物奇聞","question":"鯊魚骨骼主要由甚麼構成？","options":["象牙質","軟骨","幾丁質","矽質"],"answer":1,"explanation":"鯊魚屬軟骨魚，骨架可鈣化但不同於典型硬骨。","answer_letter":"B","source":null},{"id":"Q0026","category":"動物奇聞","question":"鯊魚皮摸起來粗糙，因為有？","options":["石灰殼","皮齒","羽毛","黏土顆粒"],"answer":1,"explanation":"皮齒是微小齒狀鱗片，不是普通光滑魚鱗。","answer_letter":"B","source":null},{"id":"Q0027","category":"動物奇聞","question":"鯊魚掉牙後通常會怎樣？","options":["長出鳥喙","終生缺牙","後排牙補上","牙根變鰓"],"answer":2,"explanation":"許多鯊魚持續更換牙齒，像有後備牙齒隊列。","answer_letter":"C","source":null},{"id":"Q0028","category":"動物奇聞","question":"鯨鯊主要如何覓食？","options":["濾食浮游生物","吸食魚血","啃食珊瑚","咬斷鯨尾"],"answer":0,"explanation":"體型巨大不代表捕食大型動物，牠主要過濾小型食物。","answer_letter":"A","source":null},{"id":"Q0029","category":"動物奇聞","question":"飛魚離開水面後主要怎樣前進？","options":["像鳥連續拍翼","滑翔","懸停不動","噴出高壓氣體"],"answer":1,"explanation":"先在水中加速，展開胸鰭滑行，並非鳥類式主動飛行。","answer_letter":"B","source":null},{"id":"Q0030","category":"動物奇聞","question":"彈塗魚為何能在泥灘活動？","options":["完全不需氧氣","保持呼吸表面濕潤","只在真空呼吸","把肺充滿沙"],"answer":1,"explanation":"牠可利用皮膚等表面交換氣體，但仍需保持濕潤。","answer_letter":"B","source":null},{"id":"Q0031","category":"動物奇聞","question":"射水魚怎樣擊落水面上的昆蟲？","options":["以尾扇風","吐出石子","噴射墨汁","從口噴水柱"],"answer":3,"explanation":"牠會調整水柱射擊岸邊或枝葉上的小動物。","answer_letter":"D","source":null},{"id":"Q0032","category":"動物奇聞","question":"琵琶魚頭上像釣竿的構造由甚麼演變？","options":["背鰭棘","鼻孔","胸骨","舌頭"],"answer":0,"explanation":"特化鰭棘末端形成誘餌，部分深海種類還有共生發光菌。","answer_letter":"A","source":null},{"id":"Q0033","category":"動物奇聞","question":"小丑魚群中的繁殖雄魚在雌魚消失後可能？","options":["變成卵","變成海葵","失去所有鰭","轉變為雌魚"],"answer":3,"explanation":"小丑魚是雄性先熟的雌雄同體魚，轉變與社會階序有關。","answer_letter":"D","source":null},{"id":"Q0034","category":"動物奇聞","question":"清潔魚常替大魚做甚麼？","options":["啄除體外寄生物","磨尖魚牙","製造魚卵","修補魚骨"],"answer":0,"explanation":"清潔互利關係讓清潔魚得到食物，客魚減少寄生物。","answer_letter":"A","source":null},{"id":"Q0035","category":"動物奇聞","question":"電鰻的強電主要由甚麼細胞產生？","options":["軟骨細胞","骨髓細胞","特化電細胞","葉綠細胞"],"answer":2,"explanation":"大量電細胞協同放電，可用於防禦及制服獵物。","answer_letter":"C","source":null},{"id":"Q0036","category":"動物奇聞","question":"比目魚長大時哪個部位會移到同一側？","options":["兩個鼻孔變一個","整條脊椎","兩隻眼睛","所有鰭"],"answer":2,"explanation":"幼魚較對稱，變態時一隻眼移到另一側，適應側躺生活。","answer_letter":"C","source":null},{"id":"Q0037","category":"動物奇聞","question":"魟魚的扁平身體兩側主要是擴大的？","options":["尾鰭","胸鰭","背鰭","腹甲"],"answer":1,"explanation":"寬大的胸鰭與頭部相連，形成像翅膀的輪廓。","answer_letter":"B","source":null},{"id":"Q0038","category":"動物奇聞","question":"鸚嘴魚吃珊瑚時可產生甚麼？","options":["珍珠","海鹽晶體","細沙","浮石"],"answer":2,"explanation":"部分鸚嘴魚磨碎碳酸鈣材料後排出，成為沙粒來源之一。","answer_letter":"C","source":null},{"id":"Q0039","category":"動物奇聞","question":"龍蝦長大時需要做甚麼？","options":["長出脊椎","吞食舊心臟","蛻去外骨骼","變成蛹"],"answer":2,"explanation":"硬殼限制體積，蛻殼後身體擴張，新殼逐漸硬化。","answer_letter":"C","source":null},{"id":"Q0040","category":"動物奇聞","question":"寄居蟹背上的螺殼通常來自？","options":["其他軟體動物","自己分泌","海藻鈣化","珊瑚蟲編織"],"answer":0,"explanation":"寄居蟹利用空螺殼保護柔軟腹部，長大時常需換殼。","answer_letter":"A","source":null},{"id":"Q0041","category":"動物奇聞","question":"槍蝦的大螯合攏時能產生？","options":["冰晶","毒箭","空化氣泡","磁場屏障"],"answer":2,"explanation":"高速水流形成氣泡，崩潰時產生強烈壓力脈衝。","answer_letter":"C","source":null},{"id":"Q0042","category":"動物奇聞","question":"螳螂蝦在分類上更接近？","options":["頭足類","環節動物","甲殼類","昆蟲"],"answer":2,"explanation":"名字帶螳螂，卻不是海中的昆蟲。","answe </script><script>(function(root){
'use strict';
function shuffle(items,rng=Math.random){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newGame(bank,size){if(![20,50,100,1000].includes(size)||size>bank.length)throw Error('題數不正確');const questions=shuffle(bank).slice(0,size).map(q=>{const correct=q.options[q.answer];const options=shuffle(q.options);return {...q,options,answer:options.indexOf(correct)};});return {schema:1,questions,index:0,answers:Array(size).fill(null)};}
function validGame(s){return !!s&&s.schema===1&&Array.isArray(s.questions)&&s.questions.length>0&&s.questions.length<=1000&&new Set(s.questions.map(q=>q.id)).size===s.questions.length&&s.questions.every(q=>typeof q.question==='string'&&typeof q.explanation==='string'&&Array.isArray(q.options)&&q.options.length===4&&new Set(q.options).size===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4)&&Array.isArray(s.answers)&&s.answers.length===s.questions.length&&s.answers.every(a=>a===null||(Number.isInteger(a)&&a>=0&&a<4))&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.questions.length;}
function score(s){return s.answers.reduce((n,a,i)=>n+(a===s.questions[i].answer?1:0),0);}
const api={shuffle,newGame,validGame,score};root.QuizCore=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>'use strict';
const $=id=>document.getElementById(id), bank=window.QUIZ_BANK, core=window.QuizCore;
const KEY='curious1000-gas-v1:';
let game=null;
function message(s){$('error').textContent=s;$('error').hidden=!s;}
function read(key){try{return JSON.parse(localStorage.getItem(KEY+key));}catch{return null;}}
function write(key,value){try{localStorage.setItem(KEY+key,JSON.stringify(value));return true;}catch{message('瀏覽器未能保存進度；本次仍可繼續玩，離開後可能無法恢復。');return false;}}
function save(){if(game)write('game',game);}
function show(id){['home','play','result'].forEach(x=>$(x).hidden=x!==id);window.scrollTo(0,0);}
function bestText(){const n=Number($('size').value),b=read('best')||{};$('best').textContent=Number.isFinite(b[n])?`這部裝置的最高分：${b[n]} / ${n}`:'每局隨機抽題，局內不重複。';}
function home(){show('home');const saved=read('game');$('resume').hidden=!core.validGame(saved);bestText();}
function start(){const saved=read('game');if(core.validGame(saved)&&saved.answers.some(x=>x===null)&&!window.confirm('開始新一局會取代上次未完成進度，繼續嗎？'))return;game=core.newGame(bank,Number($('size').value));save();render();}
function addText(parent,tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e;}
function render(){show('play');const q=game.questions[game.index],chosen=game.answers[game.index],done=chosen!==null;
$('position').textContent=`${game.index+1} / ${game.questions.length}`;$('progress').max=game.questions.length;$('progress').value=game.answers.filter(a=>a!==null).length;$('category').textContent=q.category;$('qid').textContent=q.id;$('question').textContent=q.question;
$('options').replaceChildren();q.options.forEach((text,i)=>{const button=document.createElement('button');button.className='option';button.disabled=done;addText(button,'b','ABCD'[i]);addText(button,'span',text);if(done&&i===q.answer){button.classList.add('correct');button.setAttribute('aria-label',`${'ABCD'[i]} ${text}，正確答案`);}if(done&&i===chosen&&i!==q.answer)button.classList.add('wrong');button.addEventListener('click',()=>answer(i));$('options').append(button);});
$('feedback').replaceChildren();$('feedback').hidden=!done;$('next').hidden=!done;
if(done){addText($('feedback'),'p',chosen===q.answer?'答啱！':'今次學識喇。','verdict');addText($('feedback'),'p',`正確答案：${'ABCD'[q.answer]}．${q.options[q.answer]}`);addText($('feedback'),'p',q.explanation);if(q.source&&/^https:\/\//.test(q.source.url)){const a=addText($('feedback'),'a','查看資料來源（需要網絡）');a.href=q.source.url;a.target='_blank';a.rel='noopener noreferrer';}}
$('next').textContent=game.index===game.questions.length-1?'查看成績':'下一題';$('score-now').textContent=`已答${game.answers.filter(a=>a!==null).length}題 · 答啱${core.score(game)}題`;
}
function answer(i){if(!game||game.answers[game.index]!==null||!Number.isInteger(i)||i<0||i>3)return;game.answers[game.index]=i;save();render();$('next').focus({preventScroll:true});}
function next(){if(!game||game.answers[game.index]===null)return;if(game.index<game.questions.length-1){game.index++;save();render();$('question').focus({preventScroll:true});}else finish();}
function finish(){show('result');const n=game.questions.length,score=core.score(game),best=read('best')||{};best[n]=Math.max(Number(best[n])||0,score);write('best',best);save();$('result-score').replaceChildren();addText($('result-score'),'span',String(score));addText($('result-score'),'small',` / ${n}`);$('result-copy').textContent=`正確率 ${Math.round(score/n*100)}% · 每個新知識都算收穫。`;$('review').replaceChildren();const wrong=game.questions.filter((q,i)=>game.answers[i]!==q.answer);addText($('review'),'h2',wrong.length?`再看一次 · ${wrong.length}題`:'全部答啱！');game.questions.forEach((q,i)=>{if(game.answers[i]===q.answer)return;const d=document.createElement('details');d.className='review-item';addText(d,'summary',q.question);addText(d,'p',`你的答案：${q.options[game.answers[i]]||'未作答'}`);addText(d,'p',`正確答案：${q.options[q.answer]}`);addText(d,'p',q.explanation);$('review').append(d);});}
$('start').addEventListener('click',start);$('size').addEventListener('change',bestText);$('resume').addEventListener('click',()=>{game=read('game');if(!core.validGame(game)){message('舊進度無法讀取，請開始新一局。');return;}if(game.answers.every(a=>a!==null))finish();else render();});$('leave').addEventListener('click',()=>{save();home();});$('next').addEventListener('click',next);$('again').addEventListener('click',()=>{game=core.newGame(bank,game.questions.length);save();render();});$('back').addEventListener('click',home);

window.addEventListener('pagehide',save);
if(!Array.isArray(bank)||bank.length!==1000||!core){message('題庫未完整載入，請確認完整複製程式碼。');}else{$('start').disabled=false;$('start').textContent='開始隨機挑戰';home();}
</script><script src="./pwa.js"></script></body></html>
