<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>1000題趣味獵奇問答</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f4f5;color:#111827}
.wrap{max-width:720px;margin:auto;padding:20px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:28px;margin:0 0 8px}.muted{color:#6b7280}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
button{width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:16px;margin:7px 0;cursor:pointer}
.opt{background:#f3f4f6;text-align:left}.opt.correct{background:#dcfce7}.opt.wrong{background:#fee2e2}
.primary{background:#111827;color:white}.hidden{display:none}.score{font-size:42px;font-weight:700;text-align:center}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#111827;width:0}
.explain{margin-top:12px;padding:12px;background:#f9fafb;border-radius:12px}
</style>
</head>
<body><div class="wrap">
<div class="card">
<div id="start">
<h1>1000題趣味獵奇問答</h1>
<p class="muted">每次隨機抽 50 題。可加入手機主畫面使用。</p>
<button class="primary" onclick="startQuiz()">開始挑戰</button>
</div>
<div id="quiz" class="hidden">
<div class="top"><strong id="count"></strong><span id="scoreMini"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 id="q"></h2>
<div id="opts"></div>
<div id="explain" class="explain hidden"></div>
<button id="next" class="primary hidden" onclick="nextQ()">下一題</button>
</div>
<div id="result" class="hidden">
<h1>完成！</h1><div id="score" class="score"></div>
<p class="muted" style="text-align:center">50 題挑戰完成</p>
<button class="primary" onclick="startQuiz()">再玩一次</button>
</div>
</div></div>
<script src="questions.js"></script>
<script>
let quiz=[],i=0,score=0,locked=false;
function startQuiz(){
 quiz=[...QUESTION_BANK].sort(()=>Math.random()-.5).slice(0,50);
 i=0;score=0;
 document.getElementById('start').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 render();
}
function render(){
 locked=false;
 const x=quiz[i];
 count.textContent=`第 ${i+1} / 50 題`;
 scoreMini.textContent=`${score} 分`;
 bar.style.width=`${(i/50)*100}%`;
 q.textContent=x.question; opts.innerHTML='';
 explain.classList.add('hidden'); next.classList.add('hidden');
 x.options.forEach((o,idx)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=o;
  b.onclick=()=>answer(idx,b);opts.appendChild(b);
 });
}
function answer(idx,btn){
 if(locked)return; locked=true;
 const x=quiz[i]; const bs=[...opts.children];
 bs.forEach((b,j)=>{if(j===x.answer)b.classList.add('correct')});
 if(idx===x.answer)score++; else btn.classList.add('wrong');
 explain.textContent=x.explanation; explain.classList.remove('hidden');
 next.classList.remove('hidden'); scoreMini.textContent=`${score} 分`;
}
function nextQ(){i++; if(i>=50){finish()} else render()}
function finish(){
 quizEl=document.getElementById('quiz');quizEl.classList.add('hidden');
 result.classList.remove('hidden'); document.getElementById('score').textContent=`${score} / 50`;
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))}
</script>
</body></html>
